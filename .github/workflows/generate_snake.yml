# Rebuilds the hero and the contribution snake, then publishes both to the `output` branch.
name: Generate Snake

on:
  schedule:
    # Off the top of the hour: GitHub delays or drops runs queued at :00 under load.
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - hero.config.json
      - scripts/build_hero.ps1
      - .github/workflows/generate_snake.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build hero
        run: pwsh -NoProfile -File scripts/build_hero.ps1

      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d99a00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffd23f

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub disables scheduled workflows after 60 days without repo activity,
      # which is what killed the previous version of this workflow.
      - name: Keep the daily schedule enabled
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/generate_snake.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
