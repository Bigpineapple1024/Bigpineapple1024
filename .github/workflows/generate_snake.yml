# Rebuilds the hero and the contribution snake, then publishes both to the `output` branch.
name: Generate Snake

on:
  schedule:
    # Off the top of the hour: GitHub delays or drops runs queued at :00 under load.
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - hero.config.json
      - scripts/**
      - .github/workflows/generate_snake.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build hero
        run: |
          pwsh -NoProfile -File scripts/build_hero.ps1 -Theme dark -Out dist/hero.svg
          pwsh -NoProfile -File scripts/build_hero.ps1 -Theme light -Out dist/hero-light.svg

      # Our own generator instead of Platane/snk, which always draws the whole year.
      - name: Build snake (last 13 weeks)
        run: pwsh -NoProfile -File scripts/build_snake.ps1 -Weeks 13 -Out dist/github-snake.svg -DarkOut dist/github-snake-dark.svg

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub disables scheduled workflows after 60 days without repo activity,
      # which is what killed the previous version of this workflow.
      - name: Keep the daily schedule enabled
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/generate_snake.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
